name: Poll production video generation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run authenticated production worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 50 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: half-full-video-worker" \
            "https://news-ten-omega-68.vercel.app/api/videos/worker" | jq .
